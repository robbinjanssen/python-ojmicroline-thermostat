---
name: Testing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest --cov ojmicroline_thermostat tests

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage
          include-hidden-files: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage data
        uses: actions/download-artifact@v8.0.2

      - name: Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Process coverage results
        run: |
          uv run coverage combine coverage*/.coverage*
          uv run coverage xml -i

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.1.1
