---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks with prek
        run: uv run prek run --all-files --show-diff-on-failure
        env:
          # Commits to main are expected here and the tests run in their own
          # workflow for every supported Python version.
          SKIP: no-commit-to-branch,pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true

      - name: Build package
        run: uv build --no-sources
