[project]
name = "ojmicroline-thermostat"
# The version is set from the release tag by the release workflow.
version = "0.0.0"
description = "Asynchronous Python client controlling an OJ Microline Thermostat."
authors = [{ name = "Robbin Janssen", email = "robbinjanssen@gmail.com" }]
maintainers = [{ name = "Robbin Janssen", email = "robbinjanssen@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["async", "client", "thermostat", "ojmicroline"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.0.0",
    "yarl>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/robbinjanssen/python-ojmicroline-thermostat"
Repository = "https://github.com/robbinjanssen/python-ojmicroline-thermostat"
Documentation = "https://github.com/robbinjanssen/python-ojmicroline-thermostat"
"Bug Tracker" = "https://github.com/robbinjanssen/python-ojmicroline-thermostat/issues"
Changelog = "https://github.com/robbinjanssen/python-ojmicroline-thermostat/releases"

[dependency-groups]
dev = [
    "aresponses==3.0.0",
    "codespell==2.4.3",
    "covdefaults==2.3.0",
    "coverage[toml]==7.16.2",
    "freezegun==1.5.5",
    "mypy==2.4.0",
    "prek==0.5.5",
    "pylint==4.1.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytz==2026.5",
    "ruff==0.16.10",
    "types-pytz==2026.5.0.20261006",
    "yamllint==1.38.0",
]

[tool.uv.build-backend]
module-root = ""

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["ojmicroline_thermostat"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
# Specify the target platform details in config, so your developers are
# free to run mypy on Windows, Linux, or macOS and get consistent
# results.
platform = "linux"
python_version = "3.11"

# flake8-mypy expects the two following for sensible formatting
show_column_numbers = true

# show error messages from unrelated files
follow_imports = "normal"

# suppress errors about unsatisfied imports
ignore_missing_imports = true

# be strict
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# aresponses is untyped, so its Response is Any in test handlers.
module = "tests.*"
warn_return_any = false

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T"]

[tool.pylint."MESSAGES CONTROL"]
disable= [
  "too-few-public-methods",
  "too-many-positional-arguments",
  "duplicate-code",
  "format",
  "unsubscriptable-object",
]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 20

[tool.pytest.ini_options]
addopts = "--cov"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
lint.select = ["ALL"]
lint.ignore = [
  "ANN401",  # Opinioated warning on disallowing dynamically typed expressions
  "CPY001",  # No copyright headers in source files
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "SLOT000", # Has a bug with enums: https://github.com/astral-sh/ruff/issues/5748

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# I001: config.py is untracked, so the import order differs between machines.
"test_output.py" = ["ERA001", "I001", "T201"]
"config_example.py" = ["D100", "C408", "S106"]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["ojmicroline_thermostat"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
